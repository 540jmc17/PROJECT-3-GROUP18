{% extends "base.html" %}
{% block title %}Staff Interface{% endblock %}
{% block content %}
<section class="page-header">
  <div class="shell">
    <span class="eyebrow">CampusGear / Staff</span>
    <h1>Staff Interface</h1>
    <p>Signed in as {{ user.name }}.</p>
  </div>
</section>
<section class="section">
  <div class="shell">
    <div class="feature-grid">
      <a class="feature-card" href="{{ url_for('site.catalog') }}">
        <span class="feature-icon" aria-hidden="true">01</span>
        <h3>View inventory</h3>
        <p>Review the equipment inventory.</p>
        <span class="feature-link">View catalog <span aria-hidden="true">&rarr;</span></span>
      </a>
      <button type="button" class="feature-card" disabled>Add equipment</button>
    </div>
  </div>
</section>
{% endblock %}
